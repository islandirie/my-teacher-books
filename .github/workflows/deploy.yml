name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to deploy (use an earlier one to roll back)
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets are immutable. Old ones are kept (not deleted) so tabs still running an
      # older build can load their chunks; the bucket is tiny. Upgrade path: prune assets > 30 days old.
      - name: Upload hashed assets
        run: >
          aws s3 sync dist/assets s3://${{ vars.S3_BUCKET }}/assets
          --cache-control "public,max-age=31536000,immutable"

      # Everything else (index.html, sw.js, manifest, icons) must always revalidate.
      - name: Upload app shell
        run: >
          aws s3 sync dist s3://${{ vars.S3_BUCKET }}
          --exclude "assets/*" --delete
          --cache-control "no-cache"

      # Every shell file is served with Cache-Control: no-cache, so this is belt and braces. The role
      # intentionally cannot wait on it (that needs cloudfront:GetInvalidation).
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Smoke test
        run: curl -fsS https://myteacherbooks.com/ | grep -q "My Teacher Books"
